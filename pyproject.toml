[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnguard"
version = "0.1.0"
description = "A vulnerability scanner and auto-remediation CLI for source code, secrets, and dependencies."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
vulnguard = "vulnguard.cli:main"

[tool.setuptools.packages.find]
include = ["vulnguard*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
