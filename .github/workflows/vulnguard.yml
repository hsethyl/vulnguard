name: vulnguard security scan

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  security-events: write   # required to upload SARIF to GitHub code scanning

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install vulnguard
        run: pip install -e .

      - name: Run vulnguard (SARIF report)
        run: python -m vulnguard scan . --osv --format sarif -o vulnguard.sarif

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: vulnguard.sarif

      - name: Fail the build on HIGH+ findings
        run: python -m vulnguard scan . --fail-on HIGH
